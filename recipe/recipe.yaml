context:
  version: "3.2.1"

package:
  name: pythonnet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pythonnet/pythonnet-${{ version }}.tar.gz
  sha256: c86e8dd31268f6e0c48fcc4d6030041316d49ed2764a1cb6ea8c37876e07c572

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  build:
    - dotnet-sdk 10.0.*
    - openssl
  host:
    - packaging >=24
    - pip
    - pyproject-parser >=0.14
    - python ${{ python_min }}.*
    - setuptools >=80
  run:
    - clr_loader >=0.3.1,<0.4.0
    - python >=${{ python_min }},<3.16
  run_constraints:
    - dotnet-runtime >=3.1
    - mono >=6.12

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script: python test-runtime.py coreclr
    files:
      recipe:
        - test-runtime.py
    requirements:
      run:
        - dotnet-runtime
  - if: win
    then:
      script: python test-runtime.py netfx
      files:
        recipe:
          - test-runtime.py
    else:
      - script: python test-runtime.py mono
        files:
          recipe:
            - test-runtime.py
        requirements:
          run:
            - mono

about:
  homepage: http://pythonnet.github.io
  summary: .Net and Mono integration for Python
  license: MIT
  license_file: LICENSE
  documentation: https://pythonnet.github.io/pythonnet/
  repository: https://github.com/pythonnet/pythonnet

extra:
  recipe-maintainers:
    - m-rossi
    - bgruening
